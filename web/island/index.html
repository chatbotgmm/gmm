<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="only light">
<title>갈매미맨 마을</title>
<style>
  :root { color-scheme: only light; --bg: #cfeaf3; --ink: #2f3a44; --panel: rgba(255,255,255,0.88); --accent: #e0782b; --muted: #6b7783; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--ink);
    font-family: "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif; }
  canvas { display: block; touch-action: none; }
  [hidden] { display: none !important; }
  button { border: 0; border-radius: 9px; padding: 7px 11px; font: inherit; font-size: 13.5px; cursor: pointer;
    background: #fff; color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.14); white-space: nowrap; }
  button.on { background: var(--accent); color: #fff; }
  #top { position: fixed; top: calc(10px + env(safe-area-inset-top, 0px)); left: calc(10px + env(safe-area-inset-left, 0px));
    right: calc(262px + env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 6px; align-items: flex-start; }
  .bar { display: flex; flex-wrap: wrap; gap: 6px; background: var(--panel); padding: 6px; border-radius: 12px; box-shadow: 0 1px 6px rgba(0,0,0,.1); }
  .sw { display: inline-block; width: 11px; height: 11px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; box-shadow: inset 0 0 0 1px rgba(0,0,0,.15); }
  .lab { align-self: center; font-size: 12.5px; color: var(--muted); padding: 0 2px 0 8px; }
  #msg { background: var(--panel); border-radius: 10px; padding: 6px 11px; font-size: 13.5px; }
  #panel { position: fixed; top: calc(10px + env(safe-area-inset-top, 0px)); right: calc(10px + env(safe-area-inset-right, 0px)); width: 236px;
    max-height: calc(100% - 20px - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px)); overflow: auto;
    background: var(--panel); border-radius: 12px; padding: 10px; box-shadow: 0 1px 6px rgba(0,0,0,.12); font-size: 13.5px; box-sizing: border-box; }
  #panel h1 { font-size: 16px; margin: 0 0 6px; display: flex; align-items: center; gap: 6px; }
  #fold { display: none; background: none; box-shadow: none; padding: 0 0 0 4px; color: var(--accent); margin-left: auto; }
  #stats { display: flex; flex-wrap: wrap; gap: 3px 10px; font-size: 12.5px; margin-bottom: 6px; } #stats span { white-space: nowrap; }
  .row { display: flex; gap: 8px; padding: 3px 6px; border-radius: 8px; cursor: pointer; } .row:hover { background: rgba(0,0,0,.05); }
  .row.on { background: var(--accent); color: #fff; } .row.on .act { color: #fff; } .row .nm { font-weight: 600; min-width: 54px; } .row .act { color: var(--muted); font-size: 12.5px; }
  #files { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; } #files button { font-size: 12.5px; padding: 6px 9px; }
  #help { position: fixed; left: calc(10px + env(safe-area-inset-left, 0px)); bottom: calc(10px + env(safe-area-inset-bottom, 0px));
    margin-right: calc(10px + env(safe-area-inset-right, 0px)); background: var(--panel); border-radius: 10px; padding: 6px 11px; font-size: 12.5px; }
  #overlay { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
  #top, #panel, #help { z-index: 2; }
  .badge { position: absolute; transform: translate(-50%, -100%); background: #fff; border-radius: 10px; padding: 2px 7px; font-size: 13px;
    box-shadow: 0 1px 3px rgba(0,0,0,.18); white-space: nowrap; }
  .emote { position: absolute; transform: translate(-50%, -100%); font-size: 20px; white-space: nowrap; text-shadow: 0 1px 2px rgba(255,255,255,.9); }
  .zone { position: absolute; transform: translate(-50%, -50%); font-size: 13px; padding: 2px 8px; border-radius: 8px; background: rgba(255,255,255,.75); white-space: nowrap; }
  #zones.off { opacity: .55; } .dim { color: var(--muted); }
  .row .job { margin-right: 3px; } .row .full { margin-left: auto; font-size: 11.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .row .full.hungry { color: #d0453a; font-weight: 600; } .row .full.lazy { color: #9152d0; }
  #info { font-size: 12.5px; background: rgba(0,0,0,.04); border-radius: 8px; padding: 6px 8px; margin: 0 0 6px; line-height: 1.5; }
  button.locked { opacity: .55; } button.hand.on { background: #3d8bd9; color: #fff; }
  #dex { position: fixed; inset: 0; z-index: 5; background: rgba(20,30,40,.35); display: grid; place-items: center; padding: 16px; }
  #dex .card { background: #fff; border-radius: 14px; width: min(560px, 100%); max-height: 86vh; overflow: auto; padding: 12px 14px; box-sizing: border-box; }
  #dex .head { display: flex; justify-content: space-between; align-items: center; } #dex h3 { font-size: 14px; margin: 12px 0 6px; }
  .dexgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 6px; }
  .dexcell { border: 2px solid; border-radius: 10px; padding: 6px 8px; display: flex; flex-direction: column; gap: 2px; font-size: 12.5px; }
  .dexcell.unknown { opacity: .45; } #dex p { font-size: 12px; }
  #loading { position: fixed; inset: 0; display: grid; place-items: center; font-size: 20px; pointer-events: none; }
  @media (max-width: 640px) {
    #top { right: calc(10px + env(safe-area-inset-right, 0px)); top: auto; bottom: calc(10px + env(safe-area-inset-bottom, 0px)); }
    button { font-size: 12.5px; padding: 6px 8px; }
    #panel { width: 178px; font-size: 12px; } #fold { display: inline; } #panel.folded #units, #panel.folded #files { display: none; }
    #help { display: none; }
  }
</style>
</head>
<body>
<div id="top">
  <div class="bar" id="tools"></div>
  <div class="bar" id="sub" hidden></div>
  <div id="msg" hidden></div>
</div>
<div id="panel">
  <h1>갈매미맨 마을 <button id="fold">접기</button></h1>
  <div id="stats"></div>
  <div id="info" hidden></div>
  <div id="units"></div>
  <div id="files"><button id="dexBtn">도감·가방</button><button id="quality" title="자동: 느리면 해상도를 낮춤 · 높음 · 낮음(지형·그림자 가볍게)">화질: 자동</button><button id="seeds">씨앗 뿌리기</button><button id="zones">구역 이름</button><button id="save">저장</button><button id="load">불러오기</button><button id="reset">새 섬</button></div>
</div>
<div id="help">화면: 드래그 돌리기 · 오른쪽 드래그 옮기기 · 휠 확대 · Q/E 돌리기 · 방향키 옮기기 &nbsp;|&nbsp; 도구 중: 왼쪽 = 도구 · 오른쪽 드래그나 스페이스+드래그 = 돌리기 · ✋ 화면 이동 · R 건물 돌리기 · [ ] 붓 크기 · Esc 끄기 &nbsp;|&nbsp; 휴대폰: 두 손가락 = 돌리기·확대 &nbsp;|&nbsp; 갈매미: 누르기 = 따라가기, 끌기 = 옮기기</div>
<div id="overlay"></div>
<div id="dex" hidden><div class="card"><div class="head"><b>도감 · 가방</b><button id="dexClose">닫기</button></div><div id="dexBody"></div></div></div>
<div id="loading">불러오는 중…</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
<script type="module" src="src/main.js"></script>
</body>
</html>
